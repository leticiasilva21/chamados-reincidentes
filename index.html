<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chamados Reincidentes · Carpediem</title>
<link rel="icon" href="icone.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* Identidade Carpediem: azul-marinho do logo, laranja do pin como destaque de ação. Tema claro fixo. */
:root{--navy:#16294F;--navy-2:#22386a;--orange:#F26B2E;--orange-soft:#fde9df;--gray:#58585A;
--bg:#ffffff;--panel:#F5F6F9;--line:#E3E6EC;--ink:#16294F;--mute:#5f6676;
--bad:#B3261E;--bad-soft:#fbe7e5;--warn:#8a6100;--warn-bar:#E0A526;--warn-soft:#fdf3d9;--vio:#5b3fa0;--vio-soft:#ece6f7;
--font:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
.bar-top{background:var(--navy);color:#fff;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-top .in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.bar-top img{height:34px;width:auto;display:block}
.bar-top .t{font-weight:700;font-size:1.05rem;border-left:1px solid rgba(255,255,255,.3);padding-left:16px}
.bar-top .user{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:.85rem;opacity:.95}
.bar-top .user button{border-color:rgba(255,255,255,.5);color:#fff;background:transparent;padding:4px 10px}
.bar-top .user button:hover{background:rgba(255,255,255,.12)}
.wrap{max-width:1100px;margin:0 auto;padding-block:24px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-weight:800;font-size:1.9rem;margin:0;line-height:1.15;text-wrap:balance}
h2{font-weight:800;font-size:1.2rem;margin:0 0 10px}
.sub{color:var(--mute);max-width:75ch;margin:6px 0 0}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.stamp{font-size:.85rem;color:var(--mute);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button,.btn{font:inherit;font-weight:700;border:1px solid var(--orange);background:var(--bg);color:var(--orange);border-radius:8px;padding:7px 14px;cursor:pointer}
button:hover{background:var(--orange-soft)}
button.prim{background:var(--orange);color:#fff}
button.prim:hover{background:#e05d22}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
button[disabled]{opacity:.6;cursor:wait}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:22px 0}
.kpi{background:var(--panel);border-radius:10px;padding:14px 16px}
.kpi b{display:block;font-weight:800;font-size:2rem;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{color:var(--mute);font-size:.86rem}
.kpi.bad b{color:var(--bad)}.kpi.vio b{color:var(--vio)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:28px;margin:8px 0 30px}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:190px minmax(0,1fr) 34px;gap:8px;align-items:center;font-size:.88rem}
.bar .t{height:14px;background:var(--panel);border-radius:3px;overflow:hidden;display:flex}
.bar .t i{display:block;height:100%}
.bar .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.bar small{color:var(--mute)}
.leg{display:flex;gap:14px;font-size:.8rem;color:var(--mute);margin-bottom:8px;flex-wrap:wrap}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
/* faixa de filtros logo abaixo do cabeçalho, presa ao topo enquanto a página rola */
.filtros-faixa{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:0 2px 8px rgba(22,41,79,.06);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;max-width:1100px;margin:0 auto}
.filters button{padding:5px 12px}
.filters select,.filters input{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0;max-width:100%}
.filters input{flex:1 1 200px}
.count{color:var(--mute);font-size:.86rem;margin-left:auto}
.caso{border:1px solid var(--line);border-left:4px solid var(--warn-bar);border-radius:8px;padding:14px 16px;margin-bottom:12px}
.caso.nr{border-left-color:var(--bad)}
.head{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:baseline}
.head .u{font-weight:800;word-break:break-word;min-width:0}
.pill{font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap;letter-spacing:.02em}
.p-nr{background:var(--bad-soft);color:var(--bad)}.p-ok{background:var(--warn-soft);color:var(--warn)}.p-it{background:#e6ebf4;color:var(--navy)}.p-or{background:var(--panel);color:var(--mute)}.p-vio{background:var(--vio-soft);color:var(--vio)}
.meta{color:var(--mute);font-size:.84rem;margin-top:2px}
.tl{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:12px}
.tl>li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;font-size:.9rem}
.tl .d{font-variant-numeric:tabular-nums;font-weight:800;color:var(--orange)}
.tl .tt{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.res{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:.78rem;padding:1px 6px;border-radius:4px;background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.res.rep{background:var(--vio-soft);border-color:var(--vio);color:var(--vio);font-weight:700}
.cod{color:var(--mute);font-size:.78rem}
a.cod{color:var(--navy-2);font-weight:700;text-decoration:none}a.cod:hover{text-decoration:underline}
.enc{margin-top:4px;display:grid;gap:2px;font-size:.86rem;padding-left:10px;border-left:2px solid var(--line)}
.enc .k{color:var(--mute);font-weight:700}
.enc .nr{color:var(--bad)}
.enc .vazio{color:var(--mute);font-style:italic}
.notes{background:var(--panel);border-radius:10px;padding:14px 18px;margin:0 0 28px;max-width:85ch}
.notes li{margin:4px 0}
.msg{color:var(--bad);font-size:.9rem;margin:0}
.ok{color:#1d6b3a;font-size:.9rem;margin:0}
.skel{color:var(--mute);padding:40px 0}
/* tela de login */
.login{min-height:100%;display:grid;place-items:center;padding-block:48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel)}
.card{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:32px 28px;width:100%;max-width:400px;display:grid;gap:14px;box-shadow:0 8px 24px rgba(22,41,79,.08)}
.card img{width:200px;max-width:100%;height:auto;margin:0 auto 4px;display:block}
.card h1{font-size:1.35rem;text-align:center}
.card p{margin:0;color:var(--mute);font-size:.92rem;text-align:center}
.card label{font-weight:700;font-size:.85rem;display:grid;gap:4px}
.card input{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;color:var(--ink)}
.card button{width:100%;padding:10px}
.link{background:none;border:none;color:var(--navy-2);font-weight:700;padding:0;text-decoration:underline;cursor:pointer;justify-self:center;width:auto}
.link:hover{background:none;color:var(--orange)}
/* no celular os sete filtros ocupam meia tela: a faixa fica no topo, mas não acompanha a rolagem */
@media (max-width:700px){.filtros-faixa{position:static}}
@media (max-width:520px){.bar{grid-template-columns:130px minmax(0,1fr) 30px}.tl>li{grid-template-columns:44px minmax(0,1fr)}.bar-top .t{display:none}}
</style>
</head>
<body>
<div id="app"><p class="skel wrap">Carregando…</p></div>
<script>
const SUPA = "https://ucavfotyciwnqwurzjny.supabase.co";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVjYXZmb3R5Y2l3bnF3dXJ6am55Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc5NzUzNjYsImV4cCI6MjA3MzU1MTM2Nn0.nE_W8wZZvJfzlvhP83ge1J0ooS3EcFVSlQYK28eTGU0";
const JESTOR = "https://carpediemhomes.jestor.com/app/63i03sgwbd7a97a9yh2p2?m=editRecordModal&object=chamados&id=";
const DOMINIO = /^[^@\s]+@carpediemhomes\.com\.br$/i;
// o link do e-mail volta com #...type=recovery; guarda antes de o cliente limpar a URL
let criandoSenha = /type=(recovery|invite|signup)/.test(location.hash);
const sb = supabase.createClient(SUPA, ANON, { auth: { persistSession: true, detectSessionInUrl: true, storageKey: "chamados-reinc-auth" } });

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtData = (iso) => new Date(iso).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", timeZone: "America/Sao_Paulo" });
const fmtHora = (iso) => new Date(iso).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", timeZone: "America/Sao_Paulo" });
const brl = (v) => v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

/* ---------- login ---------- */
function telaLogin(aviso) {
  $("#app").innerHTML = `<div class="login"><form class="card" id="f-login">
    <img src="logo.png" alt="Carpediem Homes">
    <h1>Chamados reincidentes</h1>
    <p>Entre com seu e-mail e senha Carpediem.</p>
    <label>E-mail<input id="l-email" type="email" autocomplete="username" placeholder="nome@carpediemhomes.com.br" required></label>
    <label>Senha<input id="l-senha" type="password" autocomplete="current-password" required></label>
    <button class="prim" type="submit" id="l-btn">Entrar</button>
    <p class="msg" id="l-msg">${aviso ? esc(aviso) : ""}</p>
    <button type="button" class="link" id="l-primeiro">Primeiro acesso ou esqueci minha senha</button>
  </form></div>`;
  $("#l-primeiro").addEventListener("click", () => telaPrimeiroAcesso($("#l-email").value));
  $("#f-login").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = $("#l-email").value.trim().toLowerCase();
    if (!DOMINIO.test(email)) return ($("#l-msg").textContent = "Use seu e-mail @carpediemhomes.com.br.");
    $("#l-btn").disabled = true; $("#l-msg").textContent = "";
    const { error } = await sb.auth.signInWithPassword({ email, password: $("#l-senha").value });
    $("#l-btn").disabled = false;
    if (error) $("#l-msg").textContent = /invalid/i.test(error.message)
      ? "E-mail ou senha incorretos. Se for seu primeiro acesso, clique no link abaixo."
      : "Não consegui entrar agora. Tente de novo.";
  });
}

function telaPrimeiroAcesso(emailInicial) {
  $("#app").innerHTML = `<div class="login"><form class="card" id="f-pa">
    <img src="logo.png" alt="Carpediem Homes">
    <h1>Primeiro acesso</h1>
    <p>Digite seu e-mail Carpediem. Vamos mandar um link para você criar ou trocar sua senha.</p>
    <label>E-mail<input id="pa-email" type="email" autocomplete="username" placeholder="nome@carpediemhomes.com.br" value="${esc(emailInicial || "")}" required></label>
    <button class="prim" type="submit" id="pa-btn">Enviar link</button>
    <p class="msg" id="pa-msg"></p>
    <button type="button" class="link" id="pa-voltar">Voltar para o login</button>
  </form></div>`;
  $("#pa-voltar").addEventListener("click", () => telaLogin());
  $("#f-pa").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = $("#pa-email").value.trim().toLowerCase();
    const msg = $("#pa-msg");
    if (!DOMINIO.test(email)) { msg.className = "msg"; return (msg.textContent = "Use seu e-mail @carpediemhomes.com.br."); }
    $("#pa-btn").disabled = true; msg.textContent = "";
    try {
      const voltar = location.hostname === "localhost" ? location.origin + location.pathname : undefined;
      const r = await fetch(SUPA + "/functions/v1/chamados-reinc-acesso", { method: "POST", headers: { apikey: ANON, "Content-Type": "application/json" }, body: JSON.stringify({ email, voltar }) });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || "Não consegui enviar o e-mail agora.");
      msg.className = "ok";
      msg.textContent = `Pronto! Enviamos um link para ${email}. Abra o e-mail e clique no link para criar sua senha. Pode levar alguns minutos; confira também o spam.`;
    } catch (err) { msg.className = "msg"; msg.textContent = err.message; }
    $("#pa-btn").disabled = false;
  });
}

function telaCriarSenha(email) {
  $("#app").innerHTML = `<div class="login"><form class="card" id="f-cs">
    <img src="logo.png" alt="Carpediem Homes">
    <h1>Crie sua senha</h1>
    <p>${esc(email || "")}</p>
    <label>Nova senha<input id="cs-1" type="password" autocomplete="new-password" minlength="8" required></label>
    <label>Repita a senha<input id="cs-2" type="password" autocomplete="new-password" minlength="8" required></label>
    <button class="prim" type="submit" id="cs-btn">Salvar senha e entrar</button>
    <p class="msg" id="cs-msg"></p>
  </form></div>`;
  $("#f-cs").addEventListener("submit", async (e) => {
    e.preventDefault();
    const a = $("#cs-1").value, b = $("#cs-2").value;
    if (a.length < 8) return ($("#cs-msg").textContent = "A senha precisa ter pelo menos 8 caracteres.");
    if (a !== b) return ($("#cs-msg").textContent = "As duas senhas estão diferentes.");
    $("#cs-btn").disabled = true;
    const { error } = await sb.auth.updateUser({ password: a });
    $("#cs-btn").disabled = false;
    if (error) return ($("#cs-msg").textContent = /different|same/i.test(error.message) ? "Escolha uma senha diferente da anterior." : "Não consegui salvar a senha. Peça um novo link e tente de novo.");
    criandoSenha = false;
    history.replaceState(null, "", location.pathname);
    carregar();
  });
}

async function sair() { await sb.auth.signOut(); telaLogin(); }

/* ---------- dados ---------- */
let D = null, usuario = null, carregando = false;
async function carregar() {
  if (carregando) return;
  carregando = true;
  try { await carregarDados(); } finally { carregando = false; }
}
async function carregarDados() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return telaLogin();
  usuario = session.user;
  if (!DOMINIO.test(usuario.email || "")) { await sb.auth.signOut(); return telaLogin("Este painel é só para contas @carpediemhomes.com.br."); }
  $("#app").innerHTML = cabecalho() + `<p class="skel wrap">Carregando chamados…</p>`;
  ligarSair();
  const { data, error } = await sb.rpc("chamados_reinc_dados");
  if (error) { $("#app").innerHTML = cabecalho() + `<div class="wrap"><p class="msg">Não consegui carregar os dados. Atualize a página em alguns minutos.</p></div>`; return ligarSair(); }
  D = data; montar();
}
const cabecalho = () => `<header class="bar-top"><div class="in"><img src="logo-branco.png" alt="Carpediem Homes"><span class="t">Chamados reincidentes</span>
  <span class="user"><span>${esc(usuario.email)}</span><button type="button" id="sair">Sair</button></span></div></header>`;
const ligarSair = () => $("#sair").addEventListener("click", sair);

async function atualizarAgora(btn) {
  btn.disabled = true; btn.textContent = "Atualizando…";
  try {
    await fetch(SUPA + "/functions/v1/chamados-reincidentes-sync", { method: "POST", headers: { apikey: ANON, "Content-Type": "application/json" }, body: "{}" });
    const { data, error } = await sb.rpc("chamados_reinc_dados");
    if (error) throw error;
    D = data; montar();
  } catch (e) { btn.disabled = false; btn.textContent = "Tentar de novo"; }
}

function montar() {
  const C = D.casos || [];
  for (const c of C) {
    const cont = {};
    c.chamados.forEach((x) => { if (x.reserva) cont[x.reserva] = (cont[x.reserva] || 0) + 1; });
    c.repetidas = Object.keys(cont).filter((k) => cont[k] > 1);
  }
  $("#app").innerHTML = cabecalho() + `<div class="filtros-faixa"><div class="filters">
   <select id="f-tipo" aria-label="Situação"><option value="">Todas as situações</option><option>Fechado sem resolver</option><option>Resolvido, mas voltou</option></select>
   <select id="f-res" aria-label="Reserva"><option value="">Qualquer reserva</option><option value="mesma">Voltou na mesma reserva</option><option value="outra">Só em reservas diferentes</option></select>
   <select id="f-item" aria-label="Problema"><option value="">Todos os problemas</option></select>
   <select id="f-rota" aria-label="Rota"><option value="">Todas as rotas</option></select>
   <select id="f-lider" aria-label="Líder"><option value="">Todos os líderes</option></select>
   <select id="f-praca" aria-label="Praça"><option value="">Todas as praças</option></select>
   <input id="f-q" type="search" placeholder="Buscar unidade, reserva ou texto">
   <button type="button" id="f-limpar" hidden>Limpar filtros</button>
   <span class="count" id="count"></span>
  </div></div>
  <main class="wrap">
  <div class="top"><div><h1>Chamados reincidentes</h1>
   <p class="sub">Mesma unidade, mesmo problema, chamado aberto de novo. Dados do Jestor, atualizados sozinhos a cada 10 minutos.</p></div>
   <div class="stamp"><span>Últimos 60 dias (desde ${fmtData(D.janela_inicio)}) · atualizado ${fmtHora(D.atualizado_em)}</span><button id="refresh" type="button">Atualizar agora</button></div></div>
  <div class="kpis" id="kpis"></div>
  <div class="grid2">
   <div><h2>Por tipo de problema</h2>${legenda()}<div class="bars" id="b-item"></div></div>
   <div><h2>Por rota e líder</h2>${legenda()}<div class="bars" id="b-rota"></div>
    <h2 style="margin-top:22px">Por praça</h2><div class="bars" id="b-praca"></div></div>
  </div>
  <div class="notes"><b>Como ler</b><ul>
   <li><b>Fechado sem resolver</b>: um chamado anterior do caso foi encerrado com algo como "estadia finalizou", "hóspede fez checkout", "realocado", "op ciente" ou "paliativo". <b>Resolvido, mas voltou</b>: o anterior foi dado como resolvido e o problema reapareceu.</li>
   <li>O <span class="res rep">código roxo</span> marca reserva que aparece em mais de um chamado do caso: o problema voltou com o mesmo hóspede. Código cinza: voltou com outro hóspede.</li>
   <li>Embaixo de cada chamado está o que quem encerrou registrou: <i>Como foi solucionado</i>, <i>Motivo</i>, <i>Repasse ao CS</i> e, quando há manutenção vinculada, quem resolveu, o que foi feito e o custo de mão de obra. O chat de comentários do Jestor não sai pela API; aparece só a quantidade.</li>
   <li>Rota e líder vêm da Mastertable de Acomodações.</li>
   <li>A ligação entre chamados é automática, pelo título e começo da descrição. Limpeza e enxoval ficam de fora.</li>
  </ul></div>
  <h2>Casos</h2>
  <div id="list"></div></main>`;
  ligarSair();
  $("#refresh").addEventListener("click", (e) => atualizarAgora(e.currentTarget));
  $("#f-limpar").addEventListener("click", () => {
    document.querySelectorAll(".filters select, .filters input").forEach((el) => (el.value = ""));
    render();
  });
  opts("#f-item", "problema"); opts("#f-rota", "rota"); opts("#f-lider", "lider"); opts("#f-praca", "praca");
  ["#f-tipo", "#f-res", "#f-item", "#f-rota", "#f-lider", "#f-praca"].forEach((s) => $(s).addEventListener("change", render));
  $("#f-q").addEventListener("input", render);
  render();
}

const legenda = () => `<div class="leg"><span><i style="background:var(--bad)"></i>fechado sem resolver</span><span><i style="background:var(--warn-bar)"></i>resolvido, mas voltou</span></div>`;

// cartões e gráficos seguem os filtros: recebem só os casos filtrados
function kpis(L, filtrado) {
  const reab = L.reduce((a, c) => a + c.n - 1, 0);
  const total = D.total_chamados || 0;
  const pct = !filtrado && total ? ` (${(reab / total * 100).toFixed(1).replace(".", ",")}% de ${total.toLocaleString("pt-BR")})` : "";
  $("#kpis").innerHTML = `
   <div class="kpi"><b>${L.length}</b><span>casos de problema repetido</span></div>
   <div class="kpi"><b>${new Set(L.map((c) => c.unidade)).size}</b><span>unidades afetadas</span></div>
   <div class="kpi"><b>${reab}</b><span>chamados reabertos${pct}</span></div>
   <div class="kpi bad"><b>${L.filter((c) => c.tipo === "Fechado sem resolver").length}</b><span>com chamado fechado sem resolver</span></div>
   <div class="kpi vio"><b>${L.filter((c) => c.repetidas.length).length}</b><span>voltaram na mesma reserva</span></div>`;
}

function bars(el, L, chave) {
  const m = {};
  L.forEach((c) => { const k = chave(c) || "—"; m[k] = m[k] || [0, 0]; m[k][c.tipo === "Fechado sem resolver" ? 0 : 1]++; });
  const rows = Object.entries(m).sort((a, b) => b[1][0] + b[1][1] - (a[1][0] + a[1][1]));
  const mx = Math.max(1, ...rows.map((r) => r[1][0] + r[1][1]));
  $(el).innerHTML = rows.map(([k, [a, b]]) => `<div class="bar"><span>${esc(k)}</span><span class="t"><i style="width:${a / mx * 100}%;background:var(--bad)"></i><i style="width:${b / mx * 100}%;background:var(--warn-bar)"></i></span><span class="n">${a + b}</span></div>`).join("");
}
function opts(id, key) {
  [...new Set(D.casos.map((c) => c[key]).filter(Boolean))].sort((a, b) => a.localeCompare(b, "pt-BR")).forEach((v) => { const o = document.createElement("option"); o.textContent = v; $(id).appendChild(o); });
}

function encerramento(x) {
  const L = [];
  if (x.solucao) L.push(`<div><span class="k">Como foi solucionado:</span> <span class="${x.nr ? "nr" : ""}">${esc(x.solucao)}</span></div>`);
  if (x.motivo) L.push(`<div><span class="k">Motivo:</span> ${esc(x.motivo)}</div>`);
  if (x.repasse) L.push(`<div><span class="k">Repasse ao CS:</span> ${esc(x.repasse)}</div>`);
  const m = x.manutencao;
  if (m) {
    const partes = [m.quem && `resolvido por ${esc(m.quem)}`, m.feito && `"${esc(m.feito)}"`, m.mao_de_obra && `mão de obra ${brl(m.mao_de_obra)}`, m.etapa && m.etapa !== "Finalizada" && `<b>${esc(m.etapa)}</b>`].filter(Boolean);
    L.push(`<div><span class="k">Manutenção:</span> ${partes.length ? partes.join(" · ") : '<span class="vazio">sem detalhes</span>'}</div>`);
  }
  if (!L.length) L.push(`<div class="vazio">Sem registro de solução.</div>`);
  const rod = [x.aberto_por && `aberto por ${esc(x.aberto_por)}`, x.finalizado_em && `finalizado em ${fmtHora(x.finalizado_em)}`, x.comentarios && `${x.comentarios} comentário${x.comentarios > 1 ? "s" : ""} no Jestor`].filter(Boolean);
  if (rod.length) L.push(`<div class="cod">${rod.join(" · ")}</div>`);
  return `<div class="enc">${L.join("")}</div>`;
}

function render() {
  const t = $("#f-tipo").value, r = $("#f-res").value, i = $("#f-item").value, ro = $("#f-rota").value, li = $("#f-lider").value, p = $("#f-praca").value, q = $("#f-q").value.toLowerCase().trim();
  const L = D.casos.filter((c) => (!t || c.tipo === t) && (!i || c.problema === i) && (!ro || c.rota === ro) && (!li || c.lider === li) && (!p || c.praca === p)
    && (!r || (r === "mesma" ? c.repetidas.length : !c.repetidas.length)) && (!q || JSON.stringify(c).toLowerCase().includes(q)));
  const filtrado = !!(t || r || i || ro || li || p || q);
  $("#count").textContent = filtrado ? `Mostrando ${L.length} de ${D.casos.length} casos` : `${D.casos.length} casos`;
  $("#f-limpar").hidden = !filtrado;
  kpis(L, filtrado);
  bars("#b-item", L, (c) => c.problema);
  bars("#b-rota", L, (c) => c.rota ? `${c.rota}${c.lider && c.lider !== c.rota ? " · " + c.lider : ""}` : null);
  bars("#b-praca", L, (c) => c.praca);
  $("#list").innerHTML = L.map((c) => `<div class="caso ${c.tipo === "Fechado sem resolver" ? "nr" : ""}">
   <div class="head"><span class="u">${esc(c.unidade)}</span><span class="pill p-it">${esc(c.problema)}</span>
    <span class="pill ${c.tipo === "Fechado sem resolver" ? "p-nr" : "p-ok"}">${esc(c.tipo)}</span>
    ${c.repetidas.length ? '<span class="pill p-vio">Mesma reserva</span>' : ""}
    ${c.orientacao ? '<span class="pill p-or">Orientação ao hóspede</span>' : ""}${c.aberto ? '<span class="pill p-nr">Ainda aberto</span>' : ""}</div>
   <div class="meta">${c.n} chamados em ${c.dias} dias · ${c.reservas_distintas} reserva${c.reservas_distintas > 1 ? "s" : ""} · ${esc(c.rota || "sem rota")}${c.lider ? " · líder " + esc(c.lider) : ""} · ${esc(c.praca || "")} · ${esc(c.negocio || "")}</div>
   <ul class="tl">${c.chamados.map((x) => `<li><span class="d">${fmtData(x.criado_em)}</span><div>
     <div class="tt"><b>${esc(x.titulo)}</b>${x.reserva ? `<span class="res ${c.repetidas.includes(x.reserva) ? "rep" : ""}" title="Código da reserva">${esc(x.reserva)}</span>` : ""}<a class="cod" href="${JESTOR}${x.id}" target="_blank" rel="noopener" title="Abrir chamado no Jestor">${esc(x.cod || "#" + x.id)} ↗</a><span class="cod">${x.status !== "Finalizado" ? esc(x.status) : ""}</span></div>
     ${encerramento(x)}</div></li>`).join("")}</ul></div>`).join("") || `<p class="skel">Nenhum caso com esses filtros.</p>`;
}

/* ---------- início ---------- */
sb.auth.onAuthStateChange((evento, session) => {
  if (evento === "PASSWORD_RECOVERY") { criandoSenha = true; telaCriarSenha(session && session.user.email); }
  else if (evento === "SIGNED_IN" && !criandoSenha && !D) carregar();
  else if (evento === "SIGNED_OUT") { D = null; }
});
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (criandoSenha && session) return telaCriarSenha(session.user.email);
  if (!criandoSenha) carregar();
})();
</script>
</body>
